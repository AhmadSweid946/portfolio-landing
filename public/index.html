<!doctype html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ahmad | Full-Stack Developer</title>
  <link href="css/output.css" rel="stylesheet" />
</head>
  <body class="bg-base-100 text-base-content">
    <div class="navbar bg-base-100 shadow-sm sticky top-0 z-50">
      <div class="navbar-start">
        <a class="font-bold text-xl">Ahmad</a>
      </div>

      <!-- Desktop links: hidden on mobile -->
      <div class="navbar-end hidden md:flex">
        <a href="#about" class="btn btn-ghost">About</a>
        <a href="#skills" class="btn btn-ghost">Skills</a>
        <a href="#projects" class="btn btn-ghost">Projects</a>
        <a href="#contact" class="btn btn-ghost">Contact</a>
      </div>

      <!-- Mobile hamburger: hidden from md up -->
      <div class="navbar-end md:hidden">
        <div class="dropdown dropdown-end">
          <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
            <svg
              aria-label="Menu"
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h7"
              />
            </svg>
          </div>
          <ul
            tabindex="-1"
            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
          >
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </div>
      </div>
    </div>
    <section
      class="flex flex-col-reverse md:flex-row items-center justify-between gap-8 max-w-5xl mx-auto py-16 px-6"
    >
      <div class="flex-1">
        <h1 class="text-4xl md:text-5xl font-bold leading-tight mb-4">
          Hi, I'm <span class="text-primary">Ahmad</span>, a Full-Stack
          Developer
        </h1>
        <p class="text-lg md:text-xl mb-6">
          Computer engineer building full-stack web apps with Node.js, Express
          and Tailwind.
        </p>
        <div class="flex gap-10 mt-6">
          <a href="#projects" class="btn btn-primary btn-lg"
            >View my projects</a
          >
          <a href="#contact" class="btn btn-outline btn-primary btn-lg"
            >Contact me</a
          >
        </div>
      </div>
      <img
        src="images/profile.png"
        alt="Photo of Ahmad"
        class="rounded-full w-56 h-56 object-cover md:h-80 md:w-80"
      />
    </section>

<section id="about" class="scroll-mt-16 max-w-5xl mx-auto py-16 px-6">
        <h2 class="text-3xl font-bold">About</h2>
    </section>

    <section id="skills" class="max-w-5xl mx-auto py-16 px-6">
      <h2 class="text-3xl font-bold">Skills</h2>
    </section>

    <section id="projects" class="max-w-5xl mx-auto py-16 px-6">
      <h2 class="text-3xl font-bold">Projects</h2>
    </section>

    <section id="contact" class="max-w-5xl mx-auto py-16 px-6">
      <h2 class="text-3xl font-bold">Contact</h2>
    </section>
  </body>
</html>
